name: catalog

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build-index --check compares against the committed tree, and the
          # version-bump guard needs main to diff against.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # sdk/test/firmware-contract.test.mjs reads the device firmware from
      # ../NewHorizonsOS-OTA and skips without it -- which would leave the
      # one test that catches library/firmware drift never running in CI.
      - name: Check out the device firmware beside this repo
        run: git clone --depth 1 https://github.com/wenzi7777/New-Horizons-OS.git ../NewHorizonsOS-OTA

      - name: Compile sources
        run: node sdk/bin/nhos.mjs compile

      - name: Validate packages
        run: node sdk/bin/nhos.mjs validate

      - name: Unit tests
        working-directory: sdk
        run: npm test

      - name: Rebuild index and fail if it drifted
        run: node sdk/bin/nhos.mjs build-index --check

      - name: Require a version bump for changed packages
        if: github.event_name == 'pull_request'
        run: node sdk/bin/nhos.mjs check-versions --base origin/${{ github.base_ref }}
